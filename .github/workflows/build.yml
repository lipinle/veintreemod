name: Build VeinTreeMod (Java 25)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract merged source archive
        run: |
          test -f veintreemod-merged-source.zip
          unzip -oq veintreemod-merged-source.zip -d extracted
          test -f extracted/build.gradle.kts
          test -f extracted/gradle/wrapper/gradle-wrapper.jar
          chmod +x extracted/gradlew
      - name: Build Fabric mod
        working-directory: extracted
        run: ./gradlew --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: veintreemod-jar
          path: extracted/build/libs/*.jar
          if-no-files-found: error
