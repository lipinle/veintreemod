name: Build VeinTreeMod (Java 25)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source files
        run: |
          test -f gradlew || { echo 'Missing Gradle wrapper: upload merged source archive first'; exit 1; }
          test -f build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: veintreemod-build
          path: build/libs/*.jar
          if-no-files-found: error
